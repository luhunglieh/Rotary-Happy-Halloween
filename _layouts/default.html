<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Q4GFD795J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-4Q4GFD795J');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title and page.title != "首頁" %}{{ page.title }} ｜ 扶輪大手牽小手{% else %}扶輪大手牽小手{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">

  <!-- Canonical URL (避免搜尋引擎重複內容分流) -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Open Graph / 社群分享預覽 (FB / LINE / Threads) -->
  <meta property="og:title" content="{% if page.title and page.title != "首頁" %}{{ page.title }} ｜ 扶輪大手牽小手{% else %}扶輪大手牽小手{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/images/Banner01.webp' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:type" content="website">

  <!-- Favicon / 瀏覽器分頁圖示 (扶輪金輪標) -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/RotaryLogo-rmb-small.webp' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/RotaryLogo-rmb-small.webp' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <!-- 全站 CSS 樣式表 (具備路徑容錯) -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" id="theme-style">
  <script>
    // 確保在本地各種預覽環境 (如 Live Server, python http.server, file://) 皆能精準載入 CSS
    document.getElementById('theme-style').addEventListener('error', function() {
      var altPath = 'assets/css/style.css';
      if (location.pathname.indexOf('/pages/') !== -1) {
        altPath = '../assets/css/style.css';
      }
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = altPath;
      document.head.appendChild(link);
    });
  </script>

  <!-- AEO Schema.org 結構化語意標記 (JSON-LD) - Event + FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Event",
        "@id": "{{ site.url }}/#event",
        "name": "國際扶輪3522地區萬聖節嘉年華會・扶輪大手牽小手",
        "startDate": "2026-10-24T11:00:00+08:00",
        "endDate": "2026-10-24T17:00:00+08:00",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "isAccessibleForFree": true,
        "location": {
          "@type": "Place",
          "name": "台北市昌隆198公園",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "市民大道三段198號",
            "addressLocality": "大安區",
            "addressRegion": "台北市",
            "addressCountry": "TW"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 25.0448,
            "longitude": 121.5385
          }
        },
        "image": [
          "{{ '/assets/images/Banner01.webp' | absolute_url }}"
        ],
        "description": "2026年國際扶輪3522地區萬聖節嘉年華會，結合公益服務、家扶弱勢兒童陪伴、特技舞台秀、鬼靈精怪伸展台裝扮大賽、小鬼市集與闖關活動。",
        "organizer": {
          "@type": "Organization",
          "name": "國際扶輪3522地區",
          "url": "{{ site.url }}"
        },
        "performer": [
          { "@type": "Person", "name": "楊元慶 (金氏世界紀錄溜溜球)" },
          { "@type": "Person", "name": "小冰 (特技雜耍藝人)" },
          { "@type": "Person", "name": "馬拉將 (魔術表演藝術家)" },
          { "@type": "Person", "name": "彩虹龍 (炫彩扯鈴藝人)" },
          { "@type": "Person", "name": "林凡 (實力派金曲歌手)" }
        ]
      },
      {
        "@type": "FAQPage",
        "@id": "{{ site.url }}/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "2026扶輪萬聖節嘉年華會需要門票嗎？費用是多少？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "活動完全免費自由入場！歡迎全家大小、親子、社區民眾自由前來台北市昌隆198公園參與觀賞特技表演與闖關活動。"
            }
          },
          {
            "@type": "Question",
            "name": "活動舉辦的時間與地點在哪裡？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "時間為 2026 年 10 月 24 日（星期六）上午 11:00 至下午 17:00。地點位於台北市大安區昌隆 198 公園（市民大道三段198號旁，鄰近忠泰美術館與忠孝復興站）。"
            }
          },
          {
            "@type": "Question",
            "name": "如何搭乘大眾交通工具前往會場？周邊方便停車嗎？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "可搭乘捷運至忠孝復興站1號出口沿安東街步行約7分鐘，或搭乘公車至忠泰美術館站下車即達。周邊設有 Times 市民大道三段地下停車場（活動棟B3）及市民大道地下停車場。"
            }
          },
          {
            "@type": "Question",
            "name": "鬼靈精怪走秀大賽和小鬼市集如何報名？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "可直接在官方網站首頁或各專屬頁面點擊 Google 表單線上免費報名，走秀冠軍獎金高達 $5,000，小鬼市集則提供孩子親身體驗當家小店長的自主擺攤樂趣。"
            }
          }
        ]
      }
    ]
  }
  </script>
</head>
<body>

  {% include nav.html %}

  <main class="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- 滾動回頂端按鈕 -->
  <button id="back-to-top" class="back-to-top" title="回到頁面頂端" aria-label="回到頁面頂端">▲</button>

  <script>
    const backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 320) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });
      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  </script>
</body>
</html>
